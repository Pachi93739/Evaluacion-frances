<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Expert - La demoiselle des Lumières</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .progress-bar {
            background-color: #e2e8f0;
            border-radius: 999px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: right;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border-color);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        .feedback {
            margin-top: 12px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .score-container {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 30px;
            padding: 24px;
            background: #e0e7ff;
            border-radius: 12px;
            color: var(--primary);
        }

        button.reset-btn {
            display: block;
            margin: 20px auto 40px auto;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.reset-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Quiz de Révision — Niveau Expert</h1>
        <p class="subtitle">La demoiselle des Lumières – Fille de Voltaire (Annie Jay)</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 12 questions répondues</div>
    </header>

    <div id="quiz-container"></div>

    <div id="score" class="score-container" style="display: none;"></div>
    <button id="reset" class="reset-btn" style="display: none;" onclick="resetQuiz()">Recommencer le quiz</button>
</div>

<script>
    const questions = [
        {
            question: "Quel siècle et quel mouvement culturel servent de toile de fond au roman d'Annie Jay ?",
            options: [
                "Le XVIIe siècle et le Classicisme",
                "Le XVIIIe siècle et l'époque des Lumières",
                "Le XVIIIe siècle et le Romantisme",
                "Le XIXe siècle et le Réalisme"
            ],
            correct: 1,
            explanation: "L’histoire se déroule précisément au XVIIIe siècle, en France, au cœur du mouvement des Lumières."
        },
        {
            question: "Quelle est la situation exacte de Marie Corneille au début du récit ?",
            options: [
                "Une jeune noble ruinée vivant à la cour de Versailles",
                "Une orpheline riche adoptée par un noble parisien",
                "Une jeune fille de 17 ans issue d'une famille pauvre",
                "Une servante au service direct de la famille de Voltaire"
            ],
            correct: 2,
            explanation: "Marie a 17 ans et vit dans des conditions difficiles au sein d'une famille pauvre, malgré sa prestigieuse ascendance."
        },
        {
            question: "Quelle est la véritable motivation de Jean-François Corneille concernant son lien avec Pierre Corneille ?",
            options: [
                "Il souhaite écrire une biographie officielle pour honorer sa mémoire",
                "Il cherche à en profiter financièrement pour améliorer leur condition précaire",
                "Il veut léguer les manuscrits originaux à l'Académie française",
                "Il souhaite créer une troupe de théâtre ambulant"
            ],
            correct: 1,
            explanation: "Le père de Marie cherche à exploiter cyniquement ce lien familial illustre dans le seul but d'obtenir de l'argent."
        },
        {
            question: "Quel lien de parenté exact unit Marie au grand dramaturge Pierre Corneille ?",
            options: [
                "Elle est sa petite-fille directe",
                "Elle est sa nièce",
                "Elle n'a aucun lien de parenté réel, c'est une invention",
                "Elle est une descendante (ancêtre éloigné)"
            ],
            correct: 3,
            explanation: "Marie descend du célèbre dramaturge français, dont il est un ancêtre éloigné."
        },
        {
            question: "Quel rôle joue Voltaire après sa rencontre avec Marie ?",
            options: [
                "Il l'engage comme secrétaire personnelle pour ses correspondances",
                "Il la prend sous sa protection pour lui offrir éducation et instruction",
                "Il la marie rapidement à un riche noble de son entourage",
                "Il l'envoie étudier dans un couvent strict à Paris"
            ],
            correct: 1,
            explanation: "Voltaire la recueille et devient à la fois son protecteur et son éducateur pour la sortir de sa condition."
        },
        {
            question: "Quels piliers intellectuels Voltaire transmet-il en priorité à Marie ?",
            options: [
                "Le dogme religieux, la soumission et la rhétorique",
                "La lecture, la réflexion, la raison et la liberté de penser",
                "L'histoire militaire, la géographie et le latin",
                "Les mathématiques appliquées et l'économie politique"
            ],
            correct: 1,
            explanation: "Il lui enseigne l'essence des Lumières : l'importance de lire, de réfléchir, d'utiliser sa raison et d'exercer sa liberté de penser."
        },
        {
            question: "Comment Marie s'adapte-t-elle au mode de vie et aux exigences de Ferney au début ?",
            options: [
                "Elle excelle immédiatement dans toutes les disciplines artistiques et mondaines",
                "Elle s'enfuit dès la première semaine car l'ambiance est trop austère",
                "Elle éprouve des difficultés, n'aime pas les tragédies et préfère apprendre à sa manière",
                "Elle refuse catégoriquement de participer aux réceptions organisées"
            ],
            correct: 2,
            explanation: "Marie a du mal au début : elle n'apprécie pas les tragédies, échoue parfois aux exercices et préfère une approche personnelle."
        },
        {
            question: "Quel personnage Marie croise-t-elle précisément lors de son passage au couvent ?",
            options: [
                "Clarisse de Saint-Rémy",
                "Madame Denis, la nièce de Voltaire",
                "La marquise de Pompadour",
                "Émilie du Châtelet"
            ],
            correct: 0,
            explanation: "Clarisse de Saint-Rémy est la jeune fille que Marie rencontre lorsqu'elle séjourne au couvent."
        },
        {
            question: "Quelle prise de conscience sociétale s'impose à Marie au fil de ses rencontres ?",
            options: [
                "Que le système monarchique français est le plus efficace du monde",
                "Que les femmes subissent des restrictions et que les pauvres manquent de droits",
                "Que la pauvreté est un choix personnel lié au manque de volonté",
                "Que la justice est parfaitement équitable pour toutes les classes sociales"
            ],
            correct: 1,
            explanation: "Elle réalise que la société est profondément injuste, notamment envers les femmes et les classes populaires."
        },
        {
            question: "Quel est le cœur de l'événement historique connu sous le nom de l'affaire Calas ?",
            options: [
                "Un complot politique ourdi contre le roi Louis XV à l'orée de la révolution",
                "Un plagiat littéraire entre Voltaire et un dramaturge rival",
                "Une injustice judiciaire subie par une famille protestante à cause du fanatisme",
                "Une escroquerie financière menée par le père de Marie à Genève"
            ],
            correct: 2,
            explanation: "L'affaire Calas met en lumière une terrible injustice judiciaire causée par l'intolérance religieuse envers une famille protestante."
        },
        {
            question: "Quelle est l'implication de Marie dans l'éclatement de l'affaire Calas ?",
            options: [
                "Elle découvre l'affaire et pousse Voltaire à s'engager dans ce combat",
                "Elle rédige elle-même le mémoire officiel présenté au Parlement",
                "Elle témoigne directement comme experte juridique au tribunal",
                "Elle refuse d'en parler pour ne pas compromettre la réputation de Voltaire"
            ],
            correct: 0,
            explanation: "C'est en découvrant cette histoire qu'elle incite Voltaire à monter au créneau pour défendre les innocents."
        },
        {
            question: "Quelle conclusion philosophique et morale Marie tire-t-elle de son évolution globale ?",
            options: [
                "Que les Lumières servent uniquement à briller dans les salons mondains",
                "Que la philosophie est une théorie abstraite sans impact réel sur le terrain",
                "Que le savoir doit servir à lutter contre les injustices et à défendre la vérité",
                "Qu'il faut se soumettre aux traditions sans chercher à comprendre"
            ],
            correct: 2,
            explanation: "Marie comprend que la culture et la raison sont des armes puissantes pour protéger les faibles et combattre le fanatisme."
        }
    ];

    let score = 0;
    let answeredCount = 0;

    function updateProgress() {
        const percentage = (answeredCount / questions.length) * 100;
        document.getElementById('progress-fill').style.width = `${percentage}%`;
        document.getElementById('progress-text').innerText = `${answeredCount} / ${questions.length} questions répondues`;
    }

    function loadQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        score = 0;
        answeredCount = 0;
        updateProgress();
        document.getElementById('score').style.display = 'none';
        document.getElementById('reset').style.display = 'none';

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'card';

            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = `${index + 1}. ${q.question}`;
            card.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            q.options.forEach((option, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(index, optIndex, btn, card, q);
                optionsDiv.appendChild(btn);
            });

            card.appendChild(optionsDiv);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback-${index}`;
            card.appendChild(feedback);

            container.appendChild(card);
        });
    }

    function selectOption(qIndex, optIndex, selectedBtn, card, q) {
        const buttons = card.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        const feedback = document.getElementById(`feedback-${qIndex}`);

        if (optIndex === q.correct) {
            selectedBtn.classList.add('correct');
            feedback.style.color = 'var(--success)';
            feedback.innerText = `✓ Correct ! ${q.explanation}`;
            score++;
        } else {
            selectedBtn.classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
            feedback.style.color = 'var(--error)';
            feedback.innerText = `✗ Incorrect. ${q.explanation}`;
        }

        answeredCount++;
        updateProgress();

        if (answeredCount === questions.length) {
            showScore();
        }
    }

    function showScore() {
        const scoreDiv = document.getElementById('score');
        scoreDiv.style.display = 'block';
        let message = "";
        if (score === 12) message = "¡Parfait ! ¡Eres un experto absoluto en la novela!";
        else if (score >= 10) message = "¡Excelente trabajo! Conoces muy bien la historia.";
        else if (score >= 7) message = "¡Buen trabajo! Has comprendido los puntos clave.";
        else message = "¡Buen intento! Te sugiero repasar un poco el resumen y reintentarlo.";

        scoreDiv.innerText = `Score final : ${score} / ${questions.length} — ${message}`;
        document.getElementById('reset').style.display = 'block';
    }

    function resetQuiz() {
        loadQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadQuiz();
</script>

</body>
</html>
